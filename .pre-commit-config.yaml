default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit
        args: [--confidence-level medium, --severity-level medium, --exclude tests]
        language: system
        pass_filenames: true
        types: [python]
        exclude: tests/*

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        args: [--fix]
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
